<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>어두운 중세 덱빌딩 RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <h1>어두운 중세 덱빌딩 RPG</h1>
    <div id="enemy-row" class="row"></div>
    <div class="vs"><span>VS</span></div>
    <div id="ally-row" class="row ally"></div>
    <div class="bottom">
      <div id="msg" class="msg"></div>
      <div id="piles" class="piles"></div>
      <div id="hand" class="hand"></div>
      <div class="bottom-row">
        <div id="energy" class="energy"></div>
        <button id="end-turn" class="end-turn">턴 종료</button>
      </div>
    </div>
  </div>
  <script src="data/rules.js"></script>
  <script src="data/cards.js"></script>
  <script src="data/battle_data.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
